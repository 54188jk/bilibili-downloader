<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'" />
  <title>贴图</title>
  <style>
    *{box-sizing:border-box;user-select:none;}
    html,body{margin:0;padding:0;background:transparent;overflow:hidden;font:12px/1.4 system-ui,sans-serif;}
    .bar{height:26px;display:flex;align-items:center;background:rgba(20,22,31,.92);color:#fff;padding:0 6px;-webkit-app-region:drag;border-radius:8px 8px 0 0;}
    .bar .dot{width:10px;height:10px;border-radius:50%;background:#34b96e;margin-right:6px;}
    .bar .lbl{flex:1;font-size:11px;color:#cfd3e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .bar button{-webkit-app-region:no-drag;border:none;background:transparent;color:#cfd3e0;cursor:pointer;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
    .bar button:hover{background:rgba(255,255,255,.12);}
    .bar button.close:hover{background:rgba(244,63,94,.2);color:#ff6b81;}
    .imgwrap{background:rgba(20,22,31,.95);height:calc(100% - 26px);display:flex;align-items:center;justify-content:center;overflow:hidden;}
    img{max-width:100%;max-height:100%;display:block;border-radius:0 0 8px 8px;}
    body.dragging img{opacity:.6;}
  </style>
</head>
<body>
  <div class="bar">
    <span class="dot"></span><span class="lbl" id="lbl">贴图</span>
    <button id="copyBtn" title="复制"><svg viewBox="0 0 14 14" fill="none"><path stroke="currentColor" d="M4.5 4.5V2h7v7h-2.5M2 5h7.5v7H2z" stroke-width="1.3"/></svg></button>
    <button id="closeBtn" class="close" title="关闭"><svg viewBox="0 0 14 14" fill="none"><path stroke="currentColor" d="m3 3 8 8m0-8-8 8" stroke-width="1.4" stroke-linecap="round"/></svg></button>
  </div>
  <div class="imgwrap"><img id="img" alt="" /></div>
  <script src="pin.js"></script>
</body>
</html>
