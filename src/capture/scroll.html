<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>长截图</title>
  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden;font:13px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;user-select:none;}
    .wrap{width:280px;height:140px;background:rgba(20,22,31,.95);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
    .title{font-weight:700;font-size:14px;color:#e6e8f0;margin-bottom:16px;}
    .bar{width:100%;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;}
    .fill{height:100%;width:0%;background:linear-gradient(90deg,#fb7299,#fc5c7d);border-radius:4px;transition:width .3s ease;}
    .text{margin-top:10px;font-size:12px;color:#9aa1b5;text-align:center;min-height:18px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">正在生成长截图</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="text" id="text">准备中…</div>
  </div>
  <script src="scroll.js"></script>
</body>
</html>
