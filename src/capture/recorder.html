<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>录屏</title>
  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;height:100%;background:#14161f;color:#e6e8f0;font:13px/1.5 system-ui,sans-serif;overflow:hidden;user-select:none;}
    .titlebar{height:40px;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02);}
    .tt{font-weight:700;font-size:13px;}
    .spacer{flex:1;}
    .main{display:flex;flex-direction:column;height:calc(100% - 40px);padding:16px;}
    .preview{flex:1;background:#0d0f16;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    video{width:100%;height:100%;object-fit:contain;background:#000;}
    .ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;}
    .btn{width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.13s;}
    .btn:hover{background:rgba(255,255,255,.12);}
    .btn svg{width:22px;height:22px;}
    .btn.rec{background:linear-gradient(135deg,#f43f5e,#fb7299);border:none;animation:pulse 1.4s infinite;}
    .btn.rec svg{stroke:#fff;}
    .btn.rec.recording{animation:none;background:#f43f5e;}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.6);}50%{box-shadow:0 0 0 16px rgba(244,63,94,0);}}
    .info{font-size:12px;color:#9aa1b5;margin-top:10px;text-align:center;}
    .fmt{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;}
    .fmt select{padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#e6e8f0;font-size:12px;}
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="tt">录屏 GIF / MP4 / WebP</span>
    <span class="spacer"></span>
    <button class="btn" style="width:28px;height:28px;border-radius:8px;" id="closeBtn"><svg viewBox="0 0 14 14" fill="none"><path stroke="currentColor" d="m3 3 8 8m0-8-8 8" stroke-width="1.5"/></svg></button>
  </div>
  <div class="main">
    <div class="preview"><video id="video" autoplay muted playsinline></video></div>
    <div class="ctrl">
      <button class="btn" id="startBtn" title="开始录制"><svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="btn rec" id="stopBtn" title="停止录制" style="display:none;"><svg viewBox="0 0 14 14" fill="currentColor"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/></svg></button>
      <button class="btn" id="saveBtn" title="保存" style="display:none;" disabled><svg viewBox="0 0 14 14" fill="none"><path stroke="currentColor" d="M4.5 8 7 10.5 9.5 8M7 10.5v-7"/><path d="M7 13.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13" stroke-width="1.3"/></svg></button>
    </div>
    <div class="fmt"><label>格式</label><select id="fmtSel"><option value="gif">GIF</option><option value="mp4">MP4</option><option value="webp">WebP</option></select></div>
    <div class="info" id="info">点击圆点开始录制 · 再次点击停止 · 支持全屏/窗口捕获</div>
  </div>
  <script src="recorder.js"></script>
</body>
</html>
