<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'" />
  <title>标注</title>
  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;height:100%;background:#14161f;color:#e6e8f0;font:13px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden;user-select:none;}
    .titlebar{height:44px;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02);}
    .tt{font-weight:700;font-size:14px;}
    .spacer{flex:1;}
    .tb{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap;}
    .tool{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:52px;padding:5px 6px;border-radius:8px;cursor:pointer;color:#9aa1b5;border:1px solid transparent;background:transparent;transition:.13s;}
    .tool svg{width:17px;height:17px;}
    .tool span{font-size:10.5px;}
    .tool:hover{background:rgba(255,255,255,.06);color:#fff;}
    .tool.active{background:linear-gradient(135deg,#fb7299,#fc5c7d);color:#fff;border-color:transparent;}
    .gutter{width:1px;height:30px;background:rgba(255,255,255,.08);margin:0 6px;}
    .swatch{width:24px;height:24px;border-radius:6px;border:2px solid rgba(255,255,255,.15);cursor:pointer;transition:transform .12s;}
    .swatch:hover{transform:scale(1.08);}
    .swatch.active{outline:2px solid #fff;outline-offset:1px;}
    .field{display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa1b5;}
    input[type=range]{width:90px;accent-color:#fb7299;}
    .canvaswrap{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px;background:#0d0f16;}
    canvas{background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:4px;max-width:100%;}
    .actions{height:56px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 16px;border-top:1px solid rgba(255,255,255,.06);}
    .btn{border-radius:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#e6e8f0;padding:8px 16px;cursor:pointer;font-size:13px;transition:.13s;}
    .btn:hover{background:rgba(255,255,255,.1);}
    .btn.primary{background:linear-gradient(135deg,#fb7299,#fc5c7d);border:none;color:#fff;font-weight:600;}
    .btn.primary:hover{filter:brightness(1.05);}
    .btn.green{background:linear-gradient(135deg,#2fa89e,#34b96e);border:none;color:#fff;}
    .btn.green:hover{filter:brightness(1.05);}
    .colorinput{width:24px;height:24px;border:none;background:none;padding:0;cursor:pointer;}
    .colorinput::-webkit-color-swatch-wrapper{padding:0;}
    .colorinput::-webkit-color-swatch{border-radius:6px;border:2px solid rgba(255,255,255,.15);}
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="tt">截图标注</span>
    <span class="spacer"></span>
    <button class="btn" id="cancelBtn" title="取消 (Esc)">取消</button>
  </div>

  <div class="tb">
    <div class="tool" data-tool="rect"><svg viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3.5" width="11" height="9" rx="1" stroke="currentColor" stroke-width="1.5"/></svg><span>矩形</span></div>
    <div class="tool" data-tool="ellipse"><svg viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="8" rx="5.5" ry="4" stroke="currentColor" stroke-width="1.5"/></svg><span>椭圆</span></div>
    <div class="tool" data-tool="arrow"><svg viewBox="0 0 16 16" fill="none"><path d="M2 14 13 3M6 2.5 13.5 3 13 10.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>箭头</span></div>
    <div class="tool" data-tool="text"><svg viewBox="0 0 16 16" fill="none"><path d="M2.5 4V2.5h11V4M8 2.5V13M5.5 13h5" stroke="currentColor" stroke-width="1.5"/></svg><span>文字</span></div>
    <div class="tool" data-tool="mosaic"><svg viewBox="0 0 16 16" fill="none"><rect x="2.5" y="2.5" width="5" height="5" rx="1" fill="currentColor" opacity=".6"/><rect x="8.5" y="2.5" width="5" height="5" rx="1" fill="currentColor" opacity=".35"/><rect x="2.5" y="8.5" width="5" height="5" rx="1" fill="currentColor" opacity=".35"/><rect x="8.5" y="8.5" width="5" height="5" rx="1" fill="currentColor"/></svg><span>马赛克</span></div>
    <div class="tool" data-tool="blur"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="3" fill="currentColor" opacity=".4"/></svg><span>模糊</span></div>
    <div class="tool" data-tool="pen"><svg viewBox="0 0 16 16" fill="none"><path d="M3 13c3-1 7-5 9-9M11 3l2 2-5 6H6L5 6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>画笔</span></div>
    <div class="tool" data-tool="picker"><svg viewBox="0 0 16 16" fill="none"><path d="M13 3c0-1-1-1.5-2-1-1 .5-.5 1.5-1.5 2L6 7.5V10l2.5 2.5L11 10l2.5-3.5C14 5.5 14 4 13 3z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M3 13l2.5.5" stroke="currentColor" stroke-width="1.2"/></svg><span>取色</span></div>
    <div class="gutter"></div>
    <div class="tool" data-tool="undo"><svg viewBox="0 0 16 16" fill="none"><path d="M6 3.5 3 6.5l3 3M3.5 6.5h6a3 3 0 1 1 0 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>撤销</span></div>
    <div class="tool" data-tool="redo"><svg viewBox="0 0 16 16" fill="none"><path d="M10 3.5l3 3-3 3M12.5 6.5h-6a3 3 0 1 0 0 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>重做</span></div>
    <div class="tool" data-tool="clear"><svg viewBox="0 0 16 16" fill="none"><path d="M3.5 4.5h9M6 2.5h4M3 4.5l.8 8a1.3 1.3 0 0 0 1.3 1.2h5.8a1.3 1.3 0 0 0 1.3-1.2l.8-8M6 7v4M10 7v4" stroke="currentColor" stroke-width="1.4"/></svg><span>清空</span></div>
    <div class="tool" data-tool="scroll"><svg viewBox="0 0 16 16" fill="none"><path d="M8 2.5v11M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M5 11l3-3 3 3M11 11l-3-3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><span>长截图</span></div>
    <div class="gutter"></div>
    <span class="field">颜色</span>
    <input type="color" id="colorInput" value="#ff4d4f" />
    <span class="field">粗细</span>
    <input type="range" id="widthInput" min="1" max="20" value="4" />
  </div>

  <div class="canvaswrap"><canvas id="canvas"></canvas></div>

  <div class="actions">
    <button class="btn" id="ocrBtn">OCR 识别</button>
    <button class="btn green" id="pinBtn">贴图</button>
    <button class="btn" id="saveBtn">保存</button>
    <button class="btn primary" id="copyBtn">复制 (Ctrl/⌘+C)</button>
  </div>

  <script src="editor.js"></script>
</body>
</html>
